name: Release
on:
  push:
    tags:
      - 'v*'
  pull_request:
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
    - name: gofmt
      run: test -z "$(gofmt -l .)"
    - name: Vet
      run: go vet ./...
    - name: golangci-lint
      uses: golangci/golangci-lint-action@v8
      with:
        version: v2.15
    - name: Test
      run: go test ./...
    - name: Vulncheck
      run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
    - name: Build
      run: |
        mkdir release
        GOOS=linux   GOARCH=amd64 go build -o release/smg_x64_linux
        GOOS=windows GOARCH=amd64 go build -o release/smg_x64_windows.exe
        GOOS=darwin  GOARCH=arm64 go build -o release/smg_arm64_darwin
    - name: Release
      uses: softprops/action-gh-release@v2
      with:
        files: release/*
